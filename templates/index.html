<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ciao Payment Submission Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }
    
   .logo-container {
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .logo-container img {
      height: 50px; /* Adjust height as needed */
      width: auto;
    }
    
    h2 {
      text-align: center;
      color: #333333;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #555555;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #cccccc;
      background: #f9f9f9;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6a11cb;
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
    }

    .note {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="form-container">

    <!-- Logo container -->
  <div class="logo-container">
    <img src="{{ url_for('static', filename='Ciao_Logo.jpg') }}" alt="Company Logo">

  </div>
  
  <h2>Ciao Payment Submission Form</h2>

  <form id="expenseForm">
    
    <!-- Expense Type -->
    <label for="expenseType">*Expense Type</label>
    <select id="expenseType" name="ExpenseType" required onchange="toggleOtherExpense()">
      <option value="">-- Select Expense Type --</option>
      <option value="Salary">Salary</option>
      <option value="Fuel">Fuel</option>
      <option value="Parking">Parking</option>
      <option value="Rent">Rent</option>
      <option value="Salik">Salik</option>
      <option value="Visa">Visa</option>
      <option value="Telecom">Telecom</option>
      <option value="Others">Others</option>
    </select>
    
    <input type="text" id="otherExpenseType" name="OtherExpenseType" placeholder="Specify Other Expense" class="hidden">

    <!-- Paid To -->
    <label for="paidTo">*Paid To</label>
    <input type="text" id="paidTo" name="PaidTo" placeholder="Recipient's Name" required>

    <!-- Amount Paid -->
    <label for="amountPaid">*Amount Paid (AED)</label>
    <input type="number" id="amountPaid" name="AmountPaid" step="0.01" min="0" placeholder="0.00" required>

    <!-- Project Name -->
    <label for="projectName">*Project Name</label>
    <select id="projectName" name="ProjectName" required onchange="toggleOtherProject()">
      <option value="">-- Select Project --</option>
      <option value="Amazon FM">Amazon FM</option>
      <option value="Amazon LM">Amazon LM</option>
      <option value="Amazon DSP Lite">Amazon DSP Lite</option>
      <option value="Mersal">Mersal</option>
      <option value="Noon">Noon</option>
      <option value="Casinetto">Casinetto</option>
      <option value="Talabat">Talabat</option>
      <option value="Wisewell Trading LLC">Wisewell Trading LLC</option>
      <option value="Others">Others</option>
    </select>

    <input type="text" id="otherProjectName" name="OtherProjectName" placeholder="Specify Other Project" class="hidden">

    <!-- Comments -->
    <label for="comments">Comments</label>
    <textarea id="comments" name="Comments" rows="4" placeholder="Additional details..."></textarea>

    <button type="submit">Submit Expense</button>

    <div class="note">* All fields are mandatory unless stated otherwise</div>

  </form>
</div>

<script>
  function toggleOtherExpense() {
    var expenseDropdown = document.getElementById('expenseType');
    var otherExpenseInput = document.getElementById('otherExpenseType');
    if (expenseDropdown.value === 'Others') {
      otherExpenseInput.classList.remove('hidden');
      otherExpenseInput.required = true;
    } else {
      otherExpenseInput.classList.add('hidden');
      otherExpenseInput.required = false;
    }
  }

  function toggleOtherProject() {
    var projectDropdown = document.getElementById('projectName');
    var otherProjectInput = document.getElementById('otherProjectName');
    if (projectDropdown.value === 'Others') {
      otherProjectInput.classList.remove('hidden');
      otherProjectInput.required = true;
    } else {
      otherProjectInput.classList.add('hidden');
      otherProjectInput.required = false;
    }
  }

  document.getElementById('expenseForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const plainFormData = Object.fromEntries(formData.entries());

    const response = await fetch('https://prod-29.uaenorth.logic.azure.com:443/workflows/efa7959306e64507a07bfc7cbb4b998a/triggers/When_a_HTTP_request_is_received/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2FWhen_a_HTTP_request_is_received%2Frun&sv=1.0&sig=1dFQBuPUEM2Cf-v9beeuOpiHF0ZW29_d9enJCjTcuYg', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(plainFormData)
    });

    if (response.ok) {
      alert('Expense submitted successfully!');
      this.reset();
      toggleOtherExpense();
      toggleOtherProject();
    } else {
      alert('Failed to submit. Please try again.');
    }
  });
</script>

</body>
</html>
